<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Rental Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        body {
            background: url('https://images.unsplash.com/photo-1710166755608-58b3d62db3a8?q=80&w=1932&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.95);
            opacity: 0.8;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            margin: 4rem auto;
        }

        h2 {
            font-weight: 600;
            color: #000000;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .form-label {
            font-weight: 500;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="text-center mb-4">🎬 Movie Rental Payment</h2>

        <!-- Payment Form -->
        <form action="process-payment" method="post">
            <!-- Subscription Selection -->
            <div class="mb-3">
                <label class="form-label">Subscription Type</label>
                <select name="subscriptionType" class="form-select" required>
                    <option>Select Subscription (Weekly / Monthly)</option>
                    <option value="weekly">Weekly (LKR 150 per week)</option>
                    <option value="monthly">Monthly (LKR 500 per month)</option>
                </select>
            </div>

            <!-- Duration Input -->
            <div class="mb-3">
                <label class="form-label">Duration (weeks/months)</label>
                <input type="number" name="duration" class="form-control" required min="1">
            </div>

            <!-- Payment Method Selection -->
            <div class="mb-3">
                <label class="form-label">Payment Method</label>
                <select name="paymentMethod" id="paymentMethod" class="form-select" required>
                    <option value="Card">Card</option>
                    <option value="PayPal">PayPal</option>
                </select>
            </div>

            <!-- Card / PayPal Details -->
            <div id="cardInput" class="mb-3">
                <label class="form-label">Card Number</label>
                <input type="text" name="cardNumber" id="cardNumber" class="form-control">
            </div>

            <div id="paypalInput" class="mb-3" style="display: none;">
                <label class="form-label">PayPal Username</label>
                <input type="text" name="paypalUsername" id="paypalUsername" class="form-control">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100 mt-3">💳 Proceed to Payment</button>
        </form>
    </div>
</div>

<script>
    // Show relevant payment input fields
    document.getElementById("paymentMethod").addEventListener("change", function () {
        const method = this.value;
        document.getElementById("cardInput").style.display = method === "Card" ? "block" : "none";
        document.getElementById("paypalInput").style.display = method === "PayPal" ? "block" : "none";
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
